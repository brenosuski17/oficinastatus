# Ambiente completo: docker compose up --build (site e API em http://localhost:3333)
# Só o banco, para usar com npm run dev: docker compose up -d postgres
name: oficinastatus
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: oficina
      POSTGRES_USER: oficina
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-oficina}
    ports:
      # 5433 para não colidir com um PostgreSQL já instalado na máquina; só acessível nela
      - "127.0.0.1:5433:5432"
    volumes:
      - dados_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oficina -d oficina"]
      interval: 3s
      timeout: 3s
      retries: 20

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - path: server/.env
        required: false
    environment:
      DATABASE_URL: postgresql://oficina:${POSTGRES_PASSWORD:-oficina}@postgres:5432/oficina
      PORT: 3333
      APP_URL: ${APP_URL:-http://localhost:3333}
    ports:
      - "3333:3333"
    volumes:
      - dados_app:/app/server/data  # fotos das OS e segredo dos logins

volumes:
  dados_postgres:
  dados_app:
